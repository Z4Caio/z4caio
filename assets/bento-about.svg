<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <!-- Left Card Gradients -->
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="60%" stop-color="#141026"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="nebulaPurple" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a277ff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaAqua" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="0"/>
    </radialGradient>

    <!-- Right Top Card (Gym / Discipline) -->
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111322"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <radialGradient id="gymGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#a277ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090a12" stop-opacity="0"/>
    </radialGradient>

    <!-- Right Bottom Card (Aquascaping / Ecosystem) -->
    <linearGradient id="aquaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081621"/>
      <stop offset="100%" stop-color="#060b12"/>
    </linearGradient>
    <radialGradient id="aquaGlow" cx="50%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#00bbf9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060b12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .label { font: 600 11px 'Consolas', monospace; fill: #94a3b8; letter-spacing: 3px; text-transform: uppercase; }
    .big-title { font: 800 30px 'Segoe UI', -apple-system, sans-serif; fill: #ffffff; letter-spacing: -0.5px; }
    .body-text { font: 400 14.5px 'Segoe UI', -apple-system, sans-serif; fill: #cbd5e1; }
    .prompt { font: 600 13.5px 'Consolas', monospace; fill: #00f5d4; }
    .mini-title { font: 700 13px 'Segoe UI', -apple-system, sans-serif; fill: #f8fafc; letter-spacing: 3.5px; text-transform: uppercase; }
    .mini-sub { font: 400 12px 'Segoe UI', -apple-system, sans-serif; fill: #94a3b8; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .cursor { animation: blink 1.2s infinite; }
    .icon-anim { animation: pulseIcon 3.5s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- ================= LEFT WIDE BENTO CARD (ABOUT) ================= -->
  <g transform="translate(0, 0)">
    <rect width="745" height="260" rx="22" fill="url(#leftBg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="745" height="260" rx="22" fill="url(#nebulaPurple)"/>
    <rect width="745" height="260" rx="22" fill="url(#nebulaAqua)"/>

    <!-- Subtle Grid Overlay on Right Side of Card -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <line x1="480" y1="0" x2="480" y2="260"/>
      <line x1="560" y1="0" x2="560" y2="260"/>
      <line x1="640" y1="0" x2="640" y2="260"/>
      <line x1="420" y1="65" x2="745" y2="65"/>
      <line x1="420" y1="130" x2="745" y2="130"/>
      <line x1="420" y1="195" x2="745" y2="195"/>
    </g>

    <text x="42" y="48" class="label">ABOUT // PERFIL</text>

    <text x="42" y="92" class="big-title">Construindo interfaces vivas</text>
    <text x="42" y="128" class="big-title">com <tspan fill="#a277ff">disciplina</tspan> e <tspan fill="#00f5d4">harmonia</tspan>.</text>

    <text x="42" y="166" class="body-text">
      Desenvolvedor <tspan fill="#ffffff" font-weight="600">Front-End (Web &amp; Mobile)</tspan> e entusiasta de <tspan fill="#ffffff" font-weight="600">UI/UX</tspan>. Uno a constância
    </text>
    <text x="42" y="188" class="body-text">
      da <tspan fill="#c4b5fd" font-weight="600">academia</tspan> ao equilíbrio visual do <tspan fill="#67e8f9" font-weight="600">aquarismo</tspan> para criar experiências únicas.
    </text>

    <text x="42" y="228" class="prompt">
      -&gt; open to collaborations, internships &amp; projects<tspan class="cursor">_</tspan>
    </text>
  </g>

  <!-- ================= TOP RIGHT MINI BENTO CARD (GYM & DISCIPLINE) ================= -->
  <g transform="translate(765, 0)">
    <rect width="435" height="122" rx="20" fill="url(#gymBg)" stroke="#2e1d59" stroke-width="1.5"/>
    <rect width="435" height="122" rx="20" fill="url(#gymGlow)"/>

    <!-- Decorative Energy Lines -->
    <line x1="40" y1="61" x2="145" y2="61" stroke="#a277ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="290" y1="61" x2="395" y2="61" stroke="#a277ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Center Icon Badge -->
    <circle cx="217" cy="40" r="20" fill="#1e1538" stroke="#a277ff" stroke-width="1.5"/>
    <text x="217" y="47" text-anchor="middle" font-size="18">🏋️‍♂️</text>

    <text x="217" y="82" text-anchor="middle" class="mini-title">GYM MINDSET · DISCIPLINE</text>
    <text x="217" y="103" text-anchor="middle" class="mini-sub">Constância diária &amp; sobrecarga progressiva no código</text>
  </g>

  <!-- ================= BOTTOM RIGHT MINI BENTO CARD (AQUASCAPING & UI) ================= -->
  <g transform="translate(765, 138)">
    <rect width="435" height="122" rx="20" fill="url(#aquaBg)" stroke="#114252" stroke-width="1.5"/>
    <rect width="435" height="122" rx="20" fill="url(#aquaGlow)"/>

    <!-- Subtle Vertical Bio-Light Columns (Like Collectioneur's Star Card) -->
    <g stroke="#00f5d4" stroke-opacity="0.1" stroke-width="6">
      <line x1="75" y1="10" x2="75" y2="112"/>
      <line x1="125" y1="10" x2="125" y2="112"/>
      <line x1="310" y1="10" x2="310" y2="112"/>
      <line x1="360" y1="10" x2="360" y2="112"/>
    </g>

    <!-- Center Icon Badge -->
    <circle cx="217" cy="40" r="20" fill="#0c2633" stroke="#00f5d4" stroke-width="1.5"/>
    <text x="217" y="47" text-anchor="middle" font-size="18">🐠</text>

    <text x="217" y="82" text-anchor="middle" class="mini-title" fill="#e0f2fe">AQUASCAPING · LIVING UI</text>
    <text x="217" y="103" text-anchor="middle" class="mini-sub">Ecossistemas equilibrados, design fluido &amp; detalhes</text>
  </g>
</svg>
