<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 760 36'
    style='background-color: #00000000;'
    width='760px' height='36px'>

    <style>
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='4200ms' fill='remove'
                    values='m0,18 h0 ; m0,18 h760 ; m0,18 h760 ; m0,18 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#67E8F9' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Interfaces em HTML, CSS e JavaScript
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,18 h0 ; m0,18 h760 ; m0,18 h760 ; m0,18 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#67E8F9' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
