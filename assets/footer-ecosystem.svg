<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#09131c"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>

    <radialGradient id="footerGlowCenter" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#a277ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070c" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a277ff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#00f5d4" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .kanji { font: 800 44px 'Segoe UI', sans-serif; fill: #00f5d4; letter-spacing: 6px; }
    .quote { font: 600 16px 'Segoe UI', -apple-system, sans-serif; fill: #f8fafc; letter-spacing: 2px; text-transform: uppercase; }
    .subquote { font: 400 13px 'Consolas', monospace; fill: #94a3b8; }

    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .wave-anim { animation: floatWave 5s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect width="1200" height="220" rx="22" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="220" rx="22" fill="url(#dotMatrix)"/>
  <ellipse cx="600" cy="120" rx="460" ry="110" fill="url(#footerGlowCenter)"/>

  <!-- Bioluminescent Waves -->
  <g class="wave-anim">
    <path d="M 60 155 Q 320 110 600 155 T 1140 145" fill="none" stroke="url(#neonStroke)" stroke-width="2"/>
    <path d="M 120 172 Q 380 205 600 168 T 1080 175" fill="none" stroke="url(#neonStroke)" stroke-width="1.2" opacity="0.65"/>
  </g>

  <!-- Center High-Tech Emblem -->
  <circle cx="600" cy="72" r="34" fill="#081520" stroke="#00f5d4" stroke-width="1.5"/>
  <circle cx="600" cy="72" r="42" fill="none" stroke="#a277ff" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="83" text-anchor="middle" font-family="'Consolas', monospace" font-size="24" font-weight="800" fill="#00f5d4">&lt;Z4/&gt;</text>

  <!-- Motto -->
  <text x="600" y="142" text-anchor="middle" class="quote">
    DISCIPLINE IN REPS 🏋️‍♂️  •  HARMONY IN DESIGN 🐠  •  EXCELLENCE IN CODE ⚡
  </text>
  <text x="600" y="172" text-anchor="middle" class="subquote">
    Obrigado pela visita! Vamos construir algo incrível juntos • Crafted by Caio (Z4Caio)
  </text>
</svg>
